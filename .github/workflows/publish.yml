# Publishes n8n-nodes-sequenzy to npm with a provenance statement whenever a
# version tag such as 1.2.3 is pushed. n8n requires provenance for verified
# community nodes from May 1 2026.
#
# This repository is exported from packages/n8n-nodes-sequenzy in the private
# Sequenzy monorepo, which pushes main and the version tag after its tests
# pass. Edit the package there, not here.
#
# npm authenticates this workflow through Trusted Publishing (OIDC): the
# n8n-nodes-sequenzy package trusts GitHub Actions, repository
# Sequenzy/n8n-nodes-sequenzy, workflow publish.yml. No NPM_TOKEN is needed.

name: Publish

on:
  push:
    tags:
      - "*.*.*"

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Mints the OIDC token for Trusted Publishing and the provenance statement.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Trusted Publishing needs npm 11.5.1 or later, bundled with Node 24.
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Check the tag matches package.json
        run: |
          set -euo pipefail

          version="$(node -p "require('./package.json').version")"
          if [[ "$version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      # In GitHub Actions `n8n-node release` lints, builds and runs
      # `npm publish` with provenance enabled.
      - name: Release
        run: npm run release
